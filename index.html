<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyrics + Romanization</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #f5f5f5;
      max-width: 680px;
      margin: 40px auto;
      padding: 20px;
    }
    .card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #2f2f2f;
    }
    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-size: 14px;
      color: #bdbdbd;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3a3a3a;
      background: #282828;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      background: #1db954;
      color: #000;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    #meta {
      margin-top: 20px;
      font-size: 14px;
      color: #9e9e9e;
    }
    #output {
      margin-top: 10px;
      padding: 18px;
      background: #151515;
      border-radius: 8px;
      border-left: 4px solid #1db954;
      white-space: pre-wrap;
      line-height: 1.6;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Song Lyrics & Romanization</h2>

    <label for="songInput">Song Name</label>
    <input type="text" id="songInput" placeholder="e.g., Spring Day" />

    <label for="artistInput">Artist Name</label>
    <input type="text" id="artistInput" placeholder="e.g., BTS" />

    <label for="scriptMode">Display Format</label>
    <select id="scriptMode">
      <option value="romanized">Romanized (English letters)</option>
      <option value="original">Original lyrics</option>
    </select>

    <button id="searchBtn" onclick="handleSearch()">Get Lyrics</button>

    <div id="meta"></div>
    <div id="output"></div>
  </div>

  <script>
    const INITIALS = [
      "g", "kk", "n", "d", "tt", "r", "m", "b", "pp",
      "s", "ss", "", "j", "jj", "ch", "k", "t", "p", "h"
    ];
    const MEDIALS = [
      "a", "ae", "ya", "yae", "eo", "e", "yeo", "ye", "o", "wa",
      "wae", "oe", "yo", "u", "wo", "we", "wi", "yu", "eu", "ui", "i"
    ];
    const FINALS = [
      "", "k", "kk", "ks", "n", "nj", "nh", "d", "l", "lg", "lm",
      "lb", "ls", "lt", "lp", "lh", "m", "p", "ps", "t", "th", "p", "ng",
      "t", "k", "t", "p", "h"
    ];

    function romanizeKorean(text) {
      let result = "";
      for (const ch of text) {
        const code = ch.charCodeAt(0);
        if (code >= 0xac00 && code <= 0xd7a3) {
          const offset = code - 0xac00;
          const initialIdx = Math.floor(offset / (21 * 28));
          const medialIdx = Math.floor((offset % (21 * 28)) / 28);
          const finalIdx = offset % 28;
          result += INITIALS[initialIdx] + MEDIALS[medialIdx] + FINALS[finalIdx];
        } else {
          result += ch;
        }
      }
      return result;
    }

    async function fetchLyrics(trackName, artistName) {
      const params = new URLSearchParams({ track_name: trackName });
      if (artistName) params.set("artist_name", artistName);

      const res = await fetch(`https://lrclib.net/api/search?${params.toString()}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const results = await res.json();
      if (!Array.isArray(results) || results.length === 0) return null;
      return results.find((item) => item.plainLyrics || item.syncedLyrics) || results[0];
    }

    async function handleSearch() {
      const song = document.getElementById("songInput").value.trim();
      const artist = document.getElementById("artistInput").value.trim();
      const mode = document.getElementById("scriptMode").value;
      const btn = document.getElementById("searchBtn");
      const meta = document.getElementById("meta");
      const output = document.getElementById("output");

      if (!song) {
        alert("Please enter a song name.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Searching...";
      meta.textContent = "";
      output.style.display = "block";
      output.textContent = "Looking up lyrics...";

      try {
        const match = await fetchLyrics(song, artist);
        if (!match) {
          output.textContent = "No matching song found.";
          return;
        }

        const rawLyrics = match.plainLyrics || match.syncedLyrics;
        if (!rawLyrics) {
          output.textContent = "No lyrics text available for this track.";
          return;
        }

        meta.textContent = `${match.trackName} — ${match.artistName}`;
        output.textContent = mode === "romanized" ? romanizeKorean(rawLyrics) : rawLyrics;
      } catch (err) {
        output.textContent = `Lookup failed: ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Get Lyrics";
      }
    }
  </script>
</body>
</html>
